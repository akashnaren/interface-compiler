<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Combobox</title>
</head>
<body>

  <main aria-label="Product">
    <label for="city">City</label>
    <input id="city" role="combobox" aria-expanded="true" aria-controls="cities">
    <ul id="cities" role="listbox">
      <li id="paris" role="option">Paris</li>
      <li id="rome" role="option">Rome</li>
    </ul>
    <label for="free">Note</label>
    <input id="free" role="combobox" aria-expanded="false">
  </main>

</body>
</html>
