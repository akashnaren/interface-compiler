<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slider</title>
</head>
<body>

  <main aria-label="Product">
    <label for="vol">Volume</label>
    <input id="vol" type="range" min="0" max="10" step="1" value="3">
    <div id="zoom" role="slider" aria-label="Zoom" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" tabindex="0" style="width:120px;height:24px"></div>
    <label for="count">Count</label>
    <input id="count" type="number" min="0" max="5" step="0.5" value="1">
  </main>

</body>
</html>
