<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buttons</title>
</head>
<body>

  <main aria-label="Product">
    <button id="add" type="button">Add to bag</button>
    <button id="more" type="button">Show more</button>
    <button id="off" type="button" disabled>Unavailable</button>
    <button id="aria" type="button" aria-disabled="true">Wait</button>
    <button id="pressed" type="button" aria-pressed="true">Filter</button>
    <div id="stack" style="position:relative;width:240px;height:80px;margin-top:16px">
      <button id="under" type="button" style="width:240px;height:80px">Under</button>
      <div id="overlay" style="position:absolute;inset:0"></div>
    </div>
  </main>

</body>
</html>
