<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabs</title>
</head>
<body>

  <main aria-label="Product">
    <div id="details-tabs" role="tablist" aria-label="Details">
      <button id="specs" type="button" role="tab" aria-selected="true">Specs</button>
      <button id="reviews" type="button" role="tab" aria-selected="false">Reviews</button>
    </div>
    <div id="ship-tabs" role="tablist" aria-label="Shipping">
      <button id="ground" type="button" role="tab" aria-selected="true">Ground</button>
      <button id="air" type="button" role="tab" aria-selected="false">Air</button>
    </div>
  </main>

</body>
</html>
