<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialog</title>
</head>
<body>

  <main aria-label="Product">
    <button id="outside" type="button">Outside</button>
  </main>
  <dialog id="modal" aria-label="Confirm">
    <button id="close" type="button">Close</button>
  </dialog>
  <script>
    document.getElementById("modal").showModal();
  </script>

</body>
</html>
