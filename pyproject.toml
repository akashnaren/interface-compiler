[project]
name = "interface-compiler"
version = "0.1.0"
description = "Compile any website into an agent-usable interface with typed, checked actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64,<2",
    "mcp>=2.3,<3",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.14,<3",
    "jsonschema>=4.26,<5",
    "typer>=0.27,<1",
    "httpx>=0.28,<1",
    "extruct>=0.18,<1",
    "protego>=0.7,<1",
    "tiktoken>=0.14,<1",
]

[project.optional-dependencies]
eval = [
    "datasets>=5.1,<6",
    "huggingface-hub>=2.4,<3",
]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<1",
]

[project.scripts]
interface-compiler = "interface_compiler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: real public pages; skipped unless --live is passed",
]
